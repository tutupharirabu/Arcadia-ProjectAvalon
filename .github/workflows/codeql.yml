name: CodeQL

on:
  push:
    branches: [main, canary, dev]
  pull_request:
    branches: [main, canary, dev]
  schedule:
    - cron: "0 3 * * 1" # Senin 03:00 UTC — scan rutin mingguan

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, php]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Query suite lebih dalam: security-extended + security-and-quality
          queries: security-extended,security-and-quality
          # PHP & JS adalah interpreted languages — tidak butuh build
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
